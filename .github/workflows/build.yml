name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q TGExporter-Android-project-1.zip
      - name: Fix typo
        run: sed -i 's/setAcceptThirdPartyCookie(/setAcceptThirdPartyCookies(/' TGExporter/app/src/main/java/com/tgexporter/app/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: TGExporter
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TGExporter-debug-apk
          path: TGExporter/app/build/outputs/apk/debug/*.apk
